<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intern</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="brand">
            <div class="brand-name">Intern</div>
            <div class="brand-subtitle">
                Context-aware knowledge assistant
            </div>
        </div>

        <div class="header-controls">
            <div class="model-selector">

                <label for="model">
                    Model
                </label>

                <select id="model">
                    <option value="">Loading...</option>
                </select>

            </div>

            <label class="knowledge-base-switch">
                <span>Knowledge Sources</span>
                <input id="knowledge-base-toggle" type="checkbox">
                <span class="switch-track" aria-hidden="true"></span>
                <span id="knowledge-base-toggle-label">OFF</span>
            </label>
        </div>

    </header>

    <div id="knowledge-base-panel" class="knowledge-base-panel" hidden>
        <div class="knowledge-base-panel-header">
            <strong>Knowledge Base</strong>
            <span>Add local files or folders to this session.</span>
        </div>
        <form id="knowledge-base-form" class="knowledge-base-form">
            <label for="knowledge-base-path">Path</label>
            <input
                id="knowledge-base-path"
                type="text"
                placeholder="/path/to/file-or-folder"
                autocomplete="off"
            >
            <button id="knowledge-base-add" type="submit">Add path</button>
        </form>
        <div
            id="knowledge-base-sources-label"
            class="knowledge-base-sources-label"
            hidden
        >Added Paths</div>
        <div
            id="knowledge-base-sources"
            class="knowledge-base-sources"
            hidden
        ></div>
        <div id="knowledge-base-status" class="knowledge-base-status" role="status">
            No sources added
        </div>
    </div>


    <!-- Chat -->
    <main id="chat" class="chat">

        <div class="welcome">

            <div class="welcome-title">
                How can I help?
            </div>

            <div class="welcome-text">
                Ask me anything or start working with your knowledge base.
            </div>

        </div>

    </main>


    <!-- Input -->
    <footer class="input-area">

        <div class="input-container">

            <textarea
                id="message"
                placeholder="Message Intern..."
                rows="1"
            ></textarea>

            <button id="send" title="Send message">
                <span>Send</span>
                <span class="send-icon">➤</span>
            </button>

        </div>

        <div class="input-hint">
            Press Enter to send · Shift + Enter for a new line
        </div>

    </footer>

</div>


<script src="/static/app.js"></script>

</body>
</html>
